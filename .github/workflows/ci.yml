name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, pruebas y empaquetado
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finanzas_owner
          POSTGRES_PASSWORD: finanzas_owner_ci
          POSTGRES_DB: finanzas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finanzas_owner -d finanzas_test"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      # Credenciales de un contenedor efímero de CI; no son secretos reales.
      DATABASE_MIGRATION_URL: postgresql://finanzas_owner:finanzas_owner_ci@localhost:5432/finanzas_test
      TEST_DATABASE_URL: postgresql://finanzas_app:finanzas_app_ci@localhost:5432/finanzas_test
      TEST_DATABASE_MIGRATION_URL: postgresql://finanzas_owner:finanzas_owner_ci@localhost:5432/finanzas_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Crear el rol de la API (sin BYPASSRLS)
        run: >
          psql "$DATABASE_MIGRATION_URL"
          -c "CREATE ROLE finanzas_app LOGIN PASSWORD 'finanzas_app_ci' NOSUPERUSER NOBYPASSRLS;"
          -c "GRANT CONNECT ON DATABASE finanzas_test TO finanzas_app;"

      - name: Lint (incluye reglas de dinero)
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Pruebas (unitarias e integración contra PostgreSQL)
        run: pnpm test

      - name: Empaquetar la app para Android, iOS y web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: pnpm --filter @finanzas/mobile exec expo export --platform android --platform ios --platform web --output-dir ${{ runner.temp }}/expo-export
